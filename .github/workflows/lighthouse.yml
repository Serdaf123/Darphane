name: Lighthouse
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://darphane-74qr.vercel.app
      - name: Lighthouse CI (mobil; erişilebilirlik ≥ 93 zorunlu, performans ≥ 80 uyarı)
        run: npx -y @lhci/cli@0.15.x autorun
