name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://fourpear.vercel.app
      - name: WebP dışı görsel var mı
        run: |
          if find public -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | grep .; then
            echo "public/ altında PNG/JPG var; npm run webp çalıştır"; exit 1; fi
